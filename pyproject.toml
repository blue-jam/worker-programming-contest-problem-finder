[project]
name = "worker-programming-contest-problem-finder"
version = "0.1.0"
description = "AtCoder参加者リストをもとにKattis/CodeChefの既AC状況と類似アカウントを突合・判定するスクリプト"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

